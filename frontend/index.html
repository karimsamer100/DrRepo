<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Evidence-driven repository auditing and prioritized remediation."
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#07191E" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEE9E1" />
    <link rel="icon" type="image/png" href="/brand/drrepo-favicon.png" />
    <title>DrRepo — Repository Audit</title>
    <script>
      ;(() => {
        const key = 'drrepo.themePreference'
        const valid = new Set(['system', 'light', 'dark'])
        let preference = 'system'
        try {
          const stored = localStorage.getItem(key)
          preference = valid.has(stored) ? stored : 'system'
        } catch {
          preference = 'system'
        }
        const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.dataset.themePreference = preference
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
